# Picnic List proxy, self-hosted with Docker (docs/PROXY.md §4). From proxy/:
#
#   sudo docker compose up -d --build        # build, start, and restart on reboot
#   sudo docker compose ps                   # health: "healthy" once /healthz answers 200
#   sudo docker compose logs -f              # one JSON line per request (never bodies, tokens or the key)
#
# Settings and secrets come from an env file kept OUTSIDE the checkout (root:root, mode 0600), by default
# /etc/picnic-proxy/picnic-proxy.env. Template: deploy/picnic-proxy.env.example.
# Another path: PICNIC_ENV_FILE=/path/to/file docker compose up -d
#
# The port is published on 127.0.0.1 only: Caddy or nginx on the host terminates TLS in front of it.
name: picnic-proxy

services:
  picnic-proxy:
    build: .
    image: picnic-proxy:local
    env_file: ${PICNIC_ENV_FILE:-/etc/picnic-proxy/picnic-proxy.env}
    environment:
      # Fixed here so the port mapping below always matches; inside the container it listens on all interfaces.
      HOST: 0.0.0.0
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    # A tiny init as PID 1 forwards SIGTERM to Node, which then drains in-flight requests.
    init: true
    # SHUTDOWN_GRACE_SECONDS (120) plus a margin, so a slow reasoning call can finish during an update.
    stop_grace_period: 130s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Node idles at about 50 MB; a few concurrent 26 MB uploads fit comfortably.
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
