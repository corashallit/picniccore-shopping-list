# nginx in front of the self-hosted Picnic List proxy (docs/PROXY.md §4.6), for when nginx already serves
# cora.earth. Needs nginx 1.25.1+ ("http2 on") and certbot. The certificate comes first, in this order,
# because the HTTPS block below can't load until its certificate exists:
#
#   # 1. Only the part above the HTTPS marker: port 80, which answers certbot's challenge.
#   sudo install -d /var/www/letsencrypt
#   sed '/^# ---- HTTPS/,$d' deploy/nginx-picnic.conf | sudo tee /etc/nginx/conf.d/picnic.cora.earth.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   # 2. The certificate. The deploy hook is saved with it, so every renewal reloads nginx; without it,
#   #    nginx keeps serving the old certificate from memory until it expires.
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d picnic.cora.earth \
#     --deploy-hook 'systemctl reload nginx'
#   # 3. The whole file, then a renewal rehearsal.
#   sudo cp deploy/nginx-picnic.conf /etc/nginx/conf.d/picnic.cora.earth.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot renew --dry-run
#
# The app's base URL is then https://picnic.cora.earth/v1, the same as with the Cloudflare Worker.
# nginx's default access log has no Authorization header, and the app sends no query strings.

upstream picnic_proxy {
    server 127.0.0.1:8787;
    keepalive 16;
    # Shorter than the proxy's keep-alive (75 s), so nginx never reuses a connection Node is closing.
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen [::]:80;
    server_name picnic.cora.earth;

    # certbot --webroot writes its challenge files here (step 1 creates the directory).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS (install this part once the certificate exists; see step 3 above)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name picnic.cora.earth;

    ssl_certificate     /etc/letsencrypt/live/picnic.cora.earth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/picnic.cora.earth/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Just above the proxy's largest route limit (26 MiB, transcriptions), so the proxy answers oversized
    # uploads itself, with an OpenAI-shaped 413 the app understands.
    client_max_body_size 27m;

    # Only the proxy's own paths reach Node.
    location ~ ^/(v1/|healthz$) {
        proxy_pass http://picnic_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        # Reasoning + web search calls are silent for up to about 2 minutes, and the proxy gives up on
        # OpenAI after 180 s (504). 300 s matches the proxy's own idle limit (IDLE_TIMEOUT_SECONDS).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Answers, SSE events included, go out as they arrive; nothing is compressed or cached on the way.
        proxy_buffering off;
        gzip off;
        # Photos and audio stream straight to the proxy instead of being written to nginx's temp files.
        proxy_request_buffering off;
    }

    location / {
        return 404;
    }
}

# Alternative: a path under the main site. Inside the existing cora.earth server block:
#
#   location /picnic/ {
#       proxy_pass http://picnic_proxy/;      # the trailing slash strips /picnic
#       ...the same proxy_* settings and client_max_body_size as above...
#   }
#
# The app's base URL is then https://cora.earth/picnic/v1.
