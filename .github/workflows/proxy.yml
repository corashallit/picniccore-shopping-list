name: Proxy

# The OpenAI proxy (proxy/): its Node tests on every change, and the Docker image built and started the
# way docs/PROXY.md §4.4 runs it. Whatever is on main is what gets deployed to the server.

on:
  push:
    branches: ['**']
    paths: ['proxy/**', '.github/workflows/proxy.yml']
  pull_request:
    paths: ['proxy/**', '.github/workflows/proxy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: proxy

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22: the Docker image and the minimum (package.json engines); 24: the next LTS (§4.9).
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # No dependencies to install: the proxy has none at runtime, and the tests use only node:test.
      - name: Tests
        run: npm test

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # compose.yaml as is: read-only root filesystem, uid 1000, no capabilities, and the image's
      # HEALTHCHECK (compose waits until it reports healthy). The key is a dummy: nothing calls OpenAI.
      - name: Build and start with compose
        run: |
          env_file="$RUNNER_TEMP/picnic-proxy-ci.env"
          {
            echo "OPENAI_API_KEY=sk-ci-dummy-key"
            echo "ACCESS_TOKEN_HASHES=ci:$(printf 'ci-token' | sha256sum | cut -d' ' -f1)"
          } > "$env_file"
          export PICNIC_ENV_FILE="$env_file"
          docker compose config --quiet
          if ! docker compose up --detach --build --wait --wait-timeout 120; then
            docker compose logs
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8787/healthz
          echo
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/v1/models/gpt-6-luna)
          [[ "$status" == 401 ]] || { echo "::error::Expected 401 without a device token, got $status"; exit 1; }
          docker compose logs

      - name: Stop
        if: always()
        run: docker compose down --timeout 5 || true
