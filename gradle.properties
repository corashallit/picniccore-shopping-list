# Gradle daemon. Sized for GitHub's smallest hosted runners (private repos: 2 vCPU / 7-8 GB).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# AGP 9 defaults already cover: android.useAndroidX, android.nonTransitiveRClass,
# android.builtInKotlin=true, android.newDsl=true. Don't re-declare them.
