# Memory budget for GitHub's smallest hosted runners (private repos: 2 vCPU / 7 GB, no swap), measured with
# CI's own command: peak 3.7 GB (was over 6 GB, and the runner died). One Gradle daemon compiles Kotlin
# in-process (no second daemon), G1 hands the compile heap back while the tests run, the Robolectric test JVM
# restarts every 36 classes (app/build.gradle.kts), and lint runs after the tests, never beside them.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:G1PeriodicGCInterval=10000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# AGP 9 defaults already cover: android.useAndroidX, android.nonTransitiveRClass,
# android.builtInKotlin=true, android.newDsl=true. Don't re-declare them.
